services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insurance}
      POSTGRES_USER: ${POSTGRES_USER:-insurance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insurance} -d ${POSTGRES_DB:-insurance}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost,http://127.0.0.1}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-14}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-admin@example.com}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-}
      DISABLE_SCHEDULER_IN_TESTS: ${DISABLE_SCHEDULER_IN_TESTS:-false}
      SCORING_WEIGHTS_FAIL_FAST: ${SCORING_WEIGHTS_FAIL_FAST:-true}
      # 产品池维护：聚合站发现 + 定时抓取 + 高置信自动发布（TASK-034）
      CRAWL_INTERVAL_MINUTES: ${CRAWL_INTERVAL_MINUTES:-720}
      SEED_DEMO_PRODUCTS: ${SEED_DEMO_PRODUCTS:-false}
      AUTO_PUBLISH_ENABLED: ${AUTO_PUBLISH_ENABLED:-true}
      AUTO_PUBLISH_CONFIDENCE: ${AUTO_PUBLISH_CONFIDENCE:-0.8}
      DISCOVERY_ENABLED: ${DISCOVERY_ENABLED:-true}
      DISCOVERY_MAX_NEW_PER_SOURCE: ${DISCOVERY_MAX_NEW_PER_SOURCE:-20}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required (fill it in .env, otherwise AI 解释模式 silently degrades to rule mode)}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2048}
      LLM_CONNECT_TIMEOUT: ${LLM_CONNECT_TIMEOUT:-3.0}
      LLM_READ_TIMEOUT: ${LLM_READ_TIMEOUT:-90.0}
      RATE_LIMIT_IP_PER_MINUTE: ${RATE_LIMIT_IP_PER_MINUTE:-120}
      RATE_LIMIT_USER_PER_MINUTE: ${RATE_LIMIT_USER_PER_MINUTE:-30}
      RATE_LIMIT_USER_PER_DAY: ${RATE_LIMIT_USER_PER_DAY:-300}
      APP_ENV: ${APP_ENV:-development}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-false}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      SECURITY_HEADERS: ${SECURITY_HEADERS:-true}
      HSTS_ENABLED: ${HSTS_ENABLED:-false}
    volumes:
      - ./backend/config:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
    ports:
      # Keep the published edge loopback-only; the Agent policy must be able
      # to prove the host binding without evaluating environment interpolation.
      - "127.0.0.1:${FRONTEND_PORT:-18080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
