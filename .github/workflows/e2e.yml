name: E2E Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frontend dependencies
        run: npm ci
        working-directory: ./frontend
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
        working-directory: ./backend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: ./frontend
      - name: Run E2E tests (real backend + vite dev server)
        # E2E_PYTHON points Playwright's backend webServer at the CI python.
        # The backend webServer itself runs `alembic upgrade head` against an
        # isolated SQLite DB (data/e2e-backend.db) before booting uvicorn.
        run: E2E_PYTHON=python npm run test:e2e
        working-directory: ./frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: frontend/test-results/
          retention-days: 14
