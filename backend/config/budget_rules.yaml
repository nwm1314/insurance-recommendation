# REC-003：绝对年预算分层（单位元）——optional 险种按总预算决定是否入池；
# 按 ratio 决定险种集合。缺失时引擎回退内置同构分层。
# 险种集合的唯一真相是本节的 absolute_budget_tiers。）
absolute_budget_tiers:
  - max_budget: 1000
    types: [医疗险, 意外险]
  - max_budget: 3000
    types: [医疗险, 意外险, 重疾险]
  - max_budget: 6000
    types: [医疗险, 意外险, 重疾险, 定期寿险]
  - max_budget: null
    types: [医疗险, 意外险, 重疾险, 定期寿险, 防癌险]

sum_insured:
  medical: 3000000
  accident_multiplier: 8
  critical_illness_multiplier: 3
  critical_illness_base: 300000
  critical_illness_max: 1000000
  life_multiplier: 5
  life_min: 500000
  cancer_default: 150000
